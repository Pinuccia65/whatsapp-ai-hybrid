services:
  - type: web
    name: whatsapp-ai-receptionist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  - type: redis
    name: receptionist-redis
    plan: free

  - type: pserv
    name: receptionist-mongo
    runtime: docker
    dockerfilePath: ./Dockerfile.mongo